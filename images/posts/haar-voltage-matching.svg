<svg xmlns="http://www.w3.org/2000/svg" width="780" height="358" viewBox="0 0 780 358" role="img" aria-label="A single base edge with voltage 1 in Z7 produces seven edges from A_i to B_(i+1). The B vertices give the seven names Mohar, Erdős, Steinerberger, Ringel, Youngs, Pisanski, and Euler."><style>text{font-family:Georgia,Times,serif;dominant-baseline:middle}</style><path d="M76,156 L244,156" stroke="#345ea5" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M164.0,159.2 L171,156 L164.0,152.8" stroke="#345ea5" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="70" cy="156" r="4.7" fill="#16183a" stroke="#16183a" stroke-width="1.6" /><circle cx="250" cy="156" r="4.7" fill="none" stroke="#16183a" stroke-width="1.6" /><text x="49" y="156" fill="#16183a" font-size="23" text-anchor="middle" font-style="italic">A</text><text x="272" y="156" fill="#16183a" font-size="23" text-anchor="middle" font-style="italic">B</text><text x="160" y="131" fill="#345ea5" font-size="23" text-anchor="middle" font-style="normal">1</text><path d="M312,156 L369,156" stroke="#606480" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M362.0,159.2 L369,156 L362.0,152.8" stroke="#606480" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="340" y="131" fill="#16183a" font-size="22" text-anchor="middle" font-style="normal">ℤ₇</text><path d="M444,24 L564,24" stroke="#345ea5" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="438" cy="24" r="4.7" fill="#16183a" stroke="#16183a" stroke-width="1.6" /><circle cx="570" cy="24" r="4.7" fill="none" stroke="#16183a" stroke-width="1.6" /><text x="419" y="24" fill="#16183a" font-size="21" text-anchor="end" font-style="italic">A₀</text><text x="590" y="24" fill="#16183a" font-size="21" text-anchor="start" font-style="italic">B₁</text><text x="626" y="24" fill="#16183a" font-size="18" text-anchor="start" font-style="normal">Erdős</text><path d="M444,68 L564,68" stroke="#345ea5" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="438" cy="68" r="4.7" fill="#16183a" stroke="#16183a" stroke-width="1.6" /><circle cx="570" cy="68" r="4.7" fill="none" stroke="#16183a" stroke-width="1.6" /><text x="419" y="68" fill="#16183a" font-size="21" text-anchor="end" font-style="italic">A₁</text><text x="590" y="68" fill="#16183a" font-size="21" text-anchor="start" font-style="italic">B₂</text><text x="626" y="68" fill="#16183a" font-size="18" text-anchor="start" font-style="normal">Steinerberger</text><path d="M444,112 L564,112" stroke="#345ea5" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="438" cy="112" r="4.7" fill="#16183a" stroke="#16183a" stroke-width="1.6" /><circle cx="570" cy="112" r="4.7" fill="none" stroke="#16183a" stroke-width="1.6" /><text x="419" y="112" fill="#16183a" font-size="21" text-anchor="end" font-style="italic">A₂</text><text x="590" y="112" fill="#16183a" font-size="21" text-anchor="start" font-style="italic">B₃</text><text x="626" y="112" fill="#16183a" font-size="18" text-anchor="start" font-style="normal">Ringel</text><path d="M444,156 L564,156" stroke="#345ea5" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="438" cy="156" r="4.7" fill="#16183a" stroke="#16183a" stroke-width="1.6" /><circle cx="570" cy="156" r="4.7" fill="none" stroke="#16183a" stroke-width="1.6" /><text x="419" y="156" fill="#16183a" font-size="21" text-anchor="end" font-style="italic">A₃</text><text x="590" y="156" fill="#16183a" font-size="21" text-anchor="start" font-style="italic">B₄</text><text x="626" y="156" fill="#16183a" font-size="18" text-anchor="start" font-style="normal">Youngs</text><path d="M444,200 L564,200" stroke="#345ea5" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="438" cy="200" r="4.7" fill="#16183a" stroke="#16183a" stroke-width="1.6" /><circle cx="570" cy="200" r="4.7" fill="none" stroke="#16183a" stroke-width="1.6" /><text x="419" y="200" fill="#16183a" font-size="21" text-anchor="end" font-style="italic">A₄</text><text x="590" y="200" fill="#16183a" font-size="21" text-anchor="start" font-style="italic">B₅</text><text x="626" y="200" fill="#16183a" font-size="18" text-anchor="start" font-style="normal">Pisanski</text><path d="M444,244 L564,244" stroke="#345ea5" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="438" cy="244" r="4.7" fill="#16183a" stroke="#16183a" stroke-width="1.6" /><circle cx="570" cy="244" r="4.7" fill="none" stroke="#16183a" stroke-width="1.6" /><text x="419" y="244" fill="#16183a" font-size="21" text-anchor="end" font-style="italic">A₅</text><text x="590" y="244" fill="#16183a" font-size="21" text-anchor="start" font-style="italic">B₆</text><text x="626" y="244" fill="#16183a" font-size="18" text-anchor="start" font-style="normal">Euler</text><path d="M444,288 L564,288" stroke="#345ea5" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="438" cy="288" r="4.7" fill="#16183a" stroke="#16183a" stroke-width="1.6" /><circle cx="570" cy="288" r="4.7" fill="none" stroke="#16183a" stroke-width="1.6" /><text x="419" y="288" fill="#16183a" font-size="21" text-anchor="end" font-style="italic">A₆</text><text x="590" y="288" fill="#16183a" font-size="21" text-anchor="start" font-style="italic">B₀</text><text x="626" y="288" fill="#16183a" font-size="18" text-anchor="start" font-style="normal">Mohar</text><text x="160" y="337" fill="#16183a" font-size="18" text-anchor="middle" font-style="normal">(a) One base edge</text><text x="569" y="337" fill="#16183a" font-size="18" text-anchor="middle" font-style="normal">(b) Its seven derived edges</text></svg>
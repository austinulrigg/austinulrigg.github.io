<svg xmlns="http://www.w3.org/2000/svg" width="750" height="240" viewBox="0 0 750 240" role="img" aria-label="A base walk takes edge 0 forward from A to B, then edge 1 backward from B to A, contributing minus 1. Its lift from A0 goes through B0 Mohar to A6. The net voltage is minus 1 in Z7."><style>text{font-family:Georgia,Times,serif;dominant-baseline:middle}</style><path d="M95,82 Q170,8 245,82" stroke="#22735a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M169.0,48.2 L176,45 L169.0,41.8" stroke="#22735a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="170" y="24" fill="#22735a" font-size="22" text-anchor="middle" font-style="normal">0</text><path d="M245,89 Q170,184 95,89" stroke="#345ea5" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M171.0,133.8 L164,137 L171.0,140.2" stroke="#345ea5" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="170" y="163" fill="#345ea5" font-size="22" text-anchor="middle" font-style="normal">−1</text><circle cx="90" cy="85" r="4.7" fill="#16183a" stroke="#16183a" stroke-width="1.6" /><circle cx="250" cy="85" r="4.7" fill="none" stroke="#16183a" stroke-width="1.6" /><text x="69" y="85" fill="#16183a" font-size="23" text-anchor="middle" font-style="italic">A</text><text x="273" y="85" fill="#16183a" font-size="23" text-anchor="middle" font-style="italic">B</text><path d="M320,85 L372,85" stroke="#606480" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M365.0,88.2 L372,85 L365.0,81.8" stroke="#606480" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="346" y="63" fill="#16183a" font-size="17" text-anchor="middle" font-style="normal">lift</text><path d="M426,85 L554,85" stroke="#22735a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M566,85 L694,85" stroke="#345ea5" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M494.0,88.2 L501,85 L494.0,81.8" stroke="#22735a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M634.0,88.2 L641,85 L634.0,81.8" stroke="#345ea5" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="490" y="62" fill="#22735a" font-size="22" text-anchor="middle" font-style="normal">0</text><text x="630" y="62" fill="#345ea5" font-size="22" text-anchor="middle" font-style="normal">−1</text><circle cx="420" cy="85" r="4.7" fill="#16183a" stroke="#16183a" stroke-width="1.6" /><text x="420" y="113" fill="#16183a" font-size="22" text-anchor="middle" font-style="italic">A₀</text><circle cx="560" cy="85" r="4.7" fill="none" stroke="#16183a" stroke-width="1.6" /><text x="560" y="113" fill="#16183a" font-size="22" text-anchor="middle" font-style="italic">B₀</text><circle cx="700" cy="85" r="4.7" fill="#16183a" stroke="#16183a" stroke-width="1.6" /><text x="700" y="113" fill="#16183a" font-size="22" text-anchor="middle" font-style="italic">A₆</text><text x="560" y="138" fill="#16183a" font-size="18" text-anchor="middle" font-style="normal">Mohar</text><text x="560" y="179" fill="#16183a" font-size="21" text-anchor="middle" font-style="normal">0 − 1 ≡ 6  (mod 7)</text><text x="170" y="222" fill="#16183a" font-size="18" text-anchor="middle" font-style="normal">(a) A closed base walk</text><text x="560" y="222" fill="#16183a" font-size="18" text-anchor="middle" font-style="normal">(b) Its lift from A₀</text></svg>